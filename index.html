<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Dictionary web app</title>
  <script>  
    // Default values for theme and font, and making sure only valid values for font and theme will be acceptable
    const defaultPreferences = {theme: "light", font: "sans"};
    const validThemes = ["light", "dark"];
    const validFonts = ["sans", "serif", "mono"];

    let preferences;
    try {
        const saved = localStorage.getItem("preferences");
        const parsedValue = saved ? JSON.parse(saved) : defaultPreferences;
        
        preferences = {
            theme: validThemes.includes(parsedValue.theme) ? parsedValue.theme : "light",
            font: validFonts.includes(parsedValue.font) ? parsedValue.font : "sans"
        };
    } catch (error) {
        // If data is corrupted, defaults will be used
        preferences = defaultPreferences;
        localStorage.removeItem("preferences");
    }
    // Preferences apply
    if(preferences.theme === "dark") {
        document.documentElement.classList.add("dark-theme");
    }
    document.documentElement.classList.add(`font-${preferences.font}`);
    localStorage.setItem("preferences", JSON.stringify(preferences));
  </script>
  <link rel="stylesheet" href="./main.css">
</head>
<body>
 <header>
    <h1 class="sr-only">Dictionary Web App</h1>
    <a href="index.html" aria-label="Redirect to homepage">
    <img src="./assets/images/logo.svg" alt="dictionary-logo" class="img-logo" />
    </a>
    <div class="settings-wrapper">
    <!-- CUSTOM SELECT ELEMENT -->
    <div class="custom-select">
        <button type="button" aria-haspopup="listbox" aria-expanded="false" 
        aria-controls="dropdownMenu" id="dropdown-button-2" class="dropdown-toggle-btn">
            <span>Sans Serif</span>
            <span><img src="./assets/images/icon-arrow-down.svg" alt=""></span>
        </button>
        <!-- DROPDOWN MENU -->
        <ul id="dropdownMenu" class="dropdown" role="listbox"    aria-labelledby="dropdown-button-2" data-filter="fontPreference" hidden>
            <li data-value="sans" role="option" aria-selected="true" tabindex="0">Sans Serif</li>
            <li data-value="serif" role="option" aria-selected="false" tabindex="0">Serif</li>
            <li data-value="mono" role="option" aria-selected="false" tabindex="0">Mono</li>
        </ul>
    </div>
    <div class="preferred-mode" aria-label="Toggle light and dark theme">
        <!-- CUSTOM TOGGLE SWITCH -->
        <input type="checkbox" id="dark-mode" aria-label="Toggle dark mode"/><label for="dark-mode" class="toggle-label">toggle theme</label>
        <span class="moon-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><path fill="none" stroke="#838383" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M1 10.449a10.544 10.544 0 0 0 19.993 4.686C11.544 15.135 6.858 10.448 6.858 1A10.545 10.545 0 0 0 1 10.449Z"/></svg>
        </span>
    </div>
    </div>
    </header>
    <main>
        <section class="dictionary-form-section">
            <form id="dictionaryForm" class="dictionary-form">
                <label for="searchTerm" class="sr-only">What are you looking for?</label>
                <div class="form-input-wrapper">
                <input type="text" name="search-term" class="form-input" id="searchTerm" placeholder="Search for any word...">
                <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><path fill="none" stroke="#A445ED" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m12.663 12.663 3.887 3.887M1 7.664a6.665 6.665 0 1 0 13.33 0 6.665 6.665 0 0 0-13.33 0Z"/></svg> 
                </span>
                </div>
                <small class="err-msg" id="errMsg" hidden>Whoops, can't be empty</small>
            </form>
        </section>
        <section class="dictionary-result" id="dictionaryResult" aria-live="polite" aria-atomic="false"  hidden>
            <div class="search-term-result">
                <div>
                    <h2 class="term" tabindex="-1" id="termEl"></h2>
                    <p class="phonetic" id="phonetic"></p>
                </div>
                <div>
                    <button id="playBtn" class="play-btn" aria-label="Play phonetic pronunciation">
                     <svg xmlns="http://www.w3.org/2000/svg" width="75" height="75" viewBox="0 0 75 75"><g fill="#A445ED" fill-rule="evenodd"><circle cx="37.5" cy="37.5" r="37.5" opacity=".25"/><path d="M29 27v21l21-10.5z"/></g></svg>
                    </button>
                    <audio src="" id="phoneticAudio"></audio>
                </div>  
            </div>
        </section>
        <section class="detail-definition" id="detailDefinition" hidden>
                
        </section>
        <!-- ERROR MESSAGE -->
        <section class="not-found" id="notFound" aria-live="polite" hidden>
            <article class="not-found-content">
                <p class="not-found-emoji">😕</p>
                <h2 class="not-found-title">No Definitions Found</h2>
                <p class="not-found-msg">Sorry pal, we couldn't find definitions for the word you were looking for.</p>
            </article>
        </section>
    </main>
    <footer id="pageFooter" hidden>
        <div class="info">
            <p>Source</p>
            <a href="#" target="_blank" rel="noopener noreferrer" id="sourceLink">
            <span id="linkText"></span>
            <span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14"><path fill="none" stroke="#838383" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6.09 3.545H2.456A1.455 1.455 0 0 0 1 5v6.545A1.455 1.455 0 0 0 2.455 13H9a1.455 1.455 0 0 0 1.455-1.455V7.91m-5.091.727 7.272-7.272m0 0H9m3.636 0V5"/></svg></span>
            </a>
        </div>
    </footer>
  <script src="./app.js"></script>
</body>
</html>
